services:
  # MariaDB with Vector support
  mariadb:
    image: mariadb:11.2
    container_name: flight-safety-mariadb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-flight_safety}
      MYSQL_USER: ${DB_USER:-app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./sql/setup.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      timeout: 20s
      retries: 10
      start_period: 30s
      interval: 30s
    networks:
      - flight-safety-network

  # Flight Safety Tracker App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-safety-app
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-flight_safety}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      STREAMLIT_PORT: ${STREAMLIT_PORT:-8501}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      LLM_MODEL: ${LLM_MODEL:-distilbert-base-cased-distilled-squad}
      MAX_SEARCH_RESULTS: ${MAX_SEARCH_RESULTS:-5}
      SIMILARITY_THRESHOLD: ${SIMILARITY_THRESHOLD:-0.7}
      DEBUG: ${DEBUG:-False}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    volumes:
      - ./data:/app/data
      - app_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      timeout: 30s
      retries: 5
      start_period: 60s
      interval: 30s
    networks:
      - flight-safety-network

  # Data Loader (runs once to populate database)
  data-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flight-safety-data-loader
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-flight_safety}
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-apppass}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-MiniLM-L6-v2}
    command: ["python", "src/data_loader.py"]
    volumes:
      - ./data:/app/data
      - app_cache:/root/.cache
    networks:
      - flight-safety-network
    profiles:
      - setup

networks:
  flight-safety-network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
  app_cache:
    driver: local